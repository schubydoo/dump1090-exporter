# Demo stack: dump1090-exporter wired into Prometheus + Grafana for local
# experimentation. Container images are pinned so Renovate can track them.
# `version:` is intentionally omitted — Compose v2 ignores it.

volumes:
  grafana_data: {}
  prometheus_data: {}

services:

  dump1090exporter:
    container_name: dump1090exporter
    build: ..
    ports:
      - "9105:9105"
    restart: always
    stop_signal: SIGINT
    command:
      - "--resource-path=http://192.168.1.201:8080"
      - "--latitude=-34.9285"
      - "--longitude=138.6007"

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    depends_on:
      - dump1090exporter
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - 9090:9090
    restart: always

  grafana:
    container_name: grafana
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    user: "104"
    depends_on:
      - prometheus
    ports:
      - 3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    env_file:
      - ./grafana/config.monitoring
    restart: always
